[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zendesk-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Zendesk ticket management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
zendesk-mcp = "zendesk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zendesk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
